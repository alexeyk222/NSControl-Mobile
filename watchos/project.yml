name: NSControlWatch
options:
  bundleIdPrefix: org.nscontrol
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  NSControlWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources: [NSControlWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nscontrol.nscontrol.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NSControl
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: org.nscontrol.nscontrol
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        TARGETED_DEVICE_FAMILY: "4"
